<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cor de Cabeça</title>
<meta name="description" content="Todo mundo vê a marca ou o personagem. Ninguém vê a cor. Quem chegar mais perto de memória ganha.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Conceito: a tela inteira É a cor que você está montando. A revelação abre em faixas lado a lado. */
:root{
  --ink:#15151a; --paper:#f3f4f6; --line:#15151a; --muted:#5d5f6b;
  --c:#888; --on:#fff;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:500 16px/1.4 var(--display);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}

.page{min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
.bars{height:clamp(90px,22vh,220px);display:flex;flex:none}
.bars i{flex:1;display:block}
.wrap{width:100%;max-width:560px;margin:0 auto;display:grid;gap:22px;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1.logo{font-size:clamp(3.2rem,15vw,5.6rem);line-height:.88;font-weight:800;letter-spacing:-.04em;margin:0;text-wrap:balance}
.lead{font-size:1.15rem;margin:0;max-width:44ch}
label.f{display:grid;gap:6px;font:700 .72rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase}
input[type=text]{width:100%;height:58px;padding:0 14px;border:3px solid var(--line);background:#fff;font:700 1.2rem var(--display);border-radius:0}
.btn{height:60px;padding:0 22px;border:3px solid var(--line);background:var(--ink);color:#fff;font:800 1.2rem var(--display);border-radius:0;width:100%;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.alt{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.row .btn{width:auto}
.or{font:700 .72rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.code{font:700 clamp(3.4rem,17vw,5.6rem)/1 var(--mono);letter-spacing:.06em;margin:0}
.eyebrow{font:700 .72rem/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.people{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:3px solid var(--line)}
.people li{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:800;font-size:1.2rem;min-width:0}
.people li span{overflow-wrap:anywhere;min-width:0}
.people em{font:500 .78rem var(--mono);color:var(--muted);flex:none;align-self:center}
.seg{display:flex;flex-wrap:wrap;border:3px solid var(--line);background:#fff}
.seg button{flex:1 1 0;min-width:0;height:48px;border:0;background:none;font:800 clamp(.82rem,3.4vw,1rem) var(--display);padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button+button{border-left:3px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.opts{display:grid;gap:14px}

#round{position:fixed;inset:0;background:var(--c);color:var(--on);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:color .15s,background-color .25s}
.time{height:14px;flex:none;background:color-mix(in srgb,var(--on) 22%,transparent)}
.time i{display:block;height:100%;background:var(--on);transform-origin:left}
.rtop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font:700 .85rem var(--mono)}
.secs{font:700 2.1rem/1 var(--mono);font-variant-numeric:tabular-nums}
.rmid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));width:100%;max-width:980px;margin:0 auto}
.rmid h2{font-size:clamp(2.1rem,8.6vw,6rem);line-height:.9;letter-spacing:-.04em;font-weight:800;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.tile{flex:none;width:clamp(112px,21vh,200px);aspect-ratio:1;max-width:100%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.14);padding:clamp(12px,2.4vh,24px);display:grid}
.mark{width:100%;height:100%;background:var(--c);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
#rTile{width:min(62vw,31vh);padding:clamp(14px,3.2vh,34px);transition:background-color .2s}
#rMark{background:none}
#rFill{display:block;width:100%;height:100%}
@media(min-width:720px){#rTile{width:min(36vw,40vh)}}
@property --paint{syntax:"<color>";inherits:true;initial-value:#c9c9cf}
.crest{width:100%;height:100%;color:var(--paint)}
.crest img{width:100%;height:100%;display:block;object-fit:contain}
#round{transition:color .15s,background-color .25s,--paint .35s}
.tile.sm{width:clamp(52px,7vw,84px);padding:8px;align-self:flex-start;margin-bottom:8px}
.rtxt{min-width:0;display:grid;gap:4px}
@media(min-width:720px){.rmid{flex-direction:row;align-items:center;justify-content:flex-start;gap:28px}}
.rmid p{font-size:clamp(1.1rem,3.4vw,1.8rem);margin:0;font-weight:500}
.rbot{width:100%;max-width:980px;margin:0 auto;display:grid;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sl{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center;font:700 .74rem var(--mono);letter-spacing:.06em;text-transform:uppercase}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:42px;margin:0;border:3px solid var(--on);border-radius:0;background:var(--track,#888);touch-action:none;cursor:pointer}
input[type=range]:disabled{opacity:.5;cursor:default}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:48px;background:#fff;border:4px solid #000;box-shadow:0 0 0 2px #fff;border-radius:0}
input[type=range]::-moz-range-thumb{width:18px;height:40px;background:#fff;border:4px solid #000;box-shadow:0 0 0 2px #fff;border-radius:0}
.who{display:flex;flex-wrap:wrap;gap:6px;font:700 .76rem var(--mono);min-height:26px}
.who span{padding:5px 10px;border:2px solid var(--on);max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span.ok{background:var(--on);color:var(--c)}
.lock{height:62px;border:3px solid var(--on);background:var(--on);color:var(--c);font:800 1.3rem var(--display);border-radius:0;width:100%}
.lock:disabled{background:none;color:var(--on);cursor:default}
.hsb{font:500 .8rem var(--mono)}

#reveal{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ink)}
.bands{flex:1;min-height:0;display:flex}
.band{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:14px;overflow:hidden;
  transform-origin:bottom;animation:rise .5s cubic-bezier(.2,.9,.2,1) backwards}
.band.orig{flex:1.5 1 0}
.band b{font-size:clamp(1.2rem,3.4vw,2.3rem);font-weight:800;line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.band .p{font:700 clamp(1.5rem,4.4vw,3.2rem)/1 var(--mono);font-variant-numeric:tabular-nums}
.band small{font:500 .74rem var(--mono)}
.tag{align-self:flex-start;padding:5px 9px;font:700 .72rem var(--mono);letter-spacing:.06em;background:var(--tagbg);color:var(--tagfg);text-transform:uppercase;margin-bottom:4px}
.rfoot{flex:none;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font:700 .86rem var(--mono)}
.rfoot button{height:46px;padding:0 18px;border:0;background:#fff;color:var(--ink);font:800 1rem var(--display);border-radius:0;flex:none}
@keyframes rise{from{transform:scaleY(0)}}
@media(max-width:720px){
  .bands{flex-direction:column}
  .band{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;transform-origin:left;gap:2px 12px;padding:10px 16px;animation-name:rise-x;align-content:center}
  .band.orig{flex-direction:column;align-items:flex-start;justify-content:center}
  .band .tag{margin:0;align-self:center}
  .band #rTile{width:min(62vw,31vh);padding:clamp(14px,3.2vh,34px);transition:background-color .2s}
#rMark{background:none}
#rFill{display:block;width:100%;height:100%}
@media(min-width:720px){#rTile{width:min(36vw,40vh)}}
@property --paint{syntax:"<color>";inherits:true;initial-value:#c9c9cf}
.crest{width:100%;height:100%;color:var(--paint)}
.crest img{width:100%;height:100%;display:block;object-fit:contain}
#round{transition:color .15s,background-color .25s,--paint .35s}
.tile.sm{width:46px;padding:6px;margin:0;align-self:center}
  .band.orig .tag{align-self:flex-start}
  .band b{flex:1 1 auto;min-width:0}
  .band.orig{flex-wrap:nowrap;gap:4px}
  .band.orig b{flex:none}
  .band.orig #rTile{width:min(62vw,31vh);padding:clamp(14px,3.2vh,34px);transition:background-color .2s}
#rMark{background:none}
#rFill{display:block;width:100%;height:100%}
@media(min-width:720px){#rTile{width:min(36vw,40vh)}}
@property --paint{syntax:"<color>";inherits:true;initial-value:#c9c9cf}
.crest{width:100%;height:100%;color:var(--paint)}
.crest img{width:100%;height:100%;display:block;object-fit:contain}
#round{transition:color .15s,background-color .25s,--paint .35s}
.tile.sm{align-self:flex-start;margin-bottom:4px}
  .band small{flex-basis:100%}
}
@keyframes rise-x{from{transform:scaleX(0)}}

#final .hero{background:var(--c);color:var(--on)}
#final .hero .wrap{padding-block:40px 28px;gap:4px}
#final h2{font-size:clamp(2.8rem,13vw,5.4rem);line-height:.9;letter-spacing:-.04em;margin:0;overflow-wrap:anywhere}
.rank{list-style:none;margin:0;padding:0;border-top:3px solid var(--line)}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:baseline;padding:12px 2px;border-bottom:1px solid var(--line)}
.rank b{font-weight:800;font-size:1.25rem;overflow-wrap:anywhere;min-width:0}
.rank .n{font:700 1.1rem var(--mono);font-variant-numeric:tabular-nums}
.rank .pos{font:700 .9rem var(--mono)}
.chips{grid-column:2/4;display:flex;height:22px}
.chips i{flex:1;display:block}

.net{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;border:2px solid #fff;padding:7px 12px;font:700 .78rem var(--mono);max-width:calc(100vw - 32px);text-align:center}
@media(prefers-reduced-motion:reduce){.band{animation:none}.btn{transition:none}}
</style>
</head>
<body>

<section id="home" class="page" hidden>
  <div class="bars" id="bars" aria-hidden="true"></div>
  <div class="wrap">
    <h1 class="logo">Cor de Cabeça</h1>
    <p class="lead">Todo mundo vê a marca ou o personagem. Ninguém vê a cor. Monte o tom de memória antes do tempo acabar: quem chegar mais perto ganha.</p>
    <form id="fHome" style="display:grid;gap:14px">
      <label class="f">Seu nome
        <input type="text" id="iName" maxlength="14" autocomplete="off" placeholder="Como te chamam" required>
      </label>
      <label class="f" id="codeF" hidden>Sala
        <input type="text" id="iCode" maxlength="4" autocomplete="off" placeholder="ABCD" style="text-transform:uppercase;font-family:var(--mono)">
      </label>
      <button class="btn" id="bPrimary" type="submit">Criar sala</button>
    </form>
    <button class="btn alt" id="bToggle" type="button">Tenho um código de sala</button>
  </div>
</section>

<section id="lobby" class="page" hidden>
  <div class="wrap">
    <div>
      <p class="eyebrow">Sala</p>
      <p class="code" id="lCode">----</p>
    </div>
    <button class="btn alt" id="bCopy" type="button">Copiar link da sala</button>
    <input type="text" id="lLink" readonly hidden aria-label="Link da sala">
    <div>
      <p class="eyebrow" id="lCount" style="margin-bottom:8px">Jogadores</p>
      <ul class="people" id="lPeople"></ul>
    </div>
    <div class="opts" id="lOpts" hidden>
      <div class="f"><p class="eyebrow">Tema</p><div class="seg" data-k="cat"></div></div>
      <div class="f"><p class="eyebrow">Rodadas</p><div class="seg" data-k="n"></div></div>
      <div class="f"><p class="eyebrow">Tempo por rodada</p><div class="seg" data-k="secs"></div></div>
      <button class="btn" id="bStart" type="button">Começar partida</button>
    </div>
    <p class="lead" id="lWait" hidden></p>
  </div>
</section>

<section id="round" hidden>
  <div class="time"><i id="rBar"></i></div>
  <div class="rtop"><span id="rNum"></span><span class="secs" id="rSecs" aria-live="off"></span></div>
  <div class="rmid"><div class="tile" id="rTile"><div class="mark" id="rMark"><canvas id="rFill" width="400" height="400"></canvas></div><div class="crest" id="rCrest" hidden></div></div><div class="rtxt"><h2 id="rBrand"></h2><p id="rName"></p></div></div>
  <div class="rbot">
    <div class="who" id="rWho"></div>
    <label class="sl"><span>Matiz</span><input type="range" id="sH" min="0" max="360" step="1" aria-label="Matiz"></label>
    <label class="sl"><span>Saturação</span><input type="range" id="sS" min="0" max="100" step="1" aria-label="Saturação"></label>
    <label class="sl"><span>Brilho</span><input type="range" id="sV" min="0" max="100" step="1" aria-label="Brilho"></label>
    <div class="hsb" id="rHsb"></div>
    <button class="lock" id="bLock" type="button">Cravar essa cor</button>
  </div>
</section>

<section id="reveal" hidden>
  <div class="bands" id="vBands"></div>
  <div class="rfoot"><span id="vInfo"></span><button id="bNext" type="button" hidden>Próxima</button></div>
</section>

<section id="final" class="page" hidden>
  <div class="hero"><div class="wrap">
    <p class="eyebrow" style="color:inherit">Ganhou a partida</p>
    <h2 id="fWinner"></h2>
  </div></div>
  <div class="wrap">
    <ol class="rank" id="fRank"></ol>
    <button class="btn" id="bAgain" type="button" hidden>Nova partida</button>
    <p class="lead" id="fWait" hidden></p>
  </div>
</section>

<div class="net" id="net" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=c=>"#"+c.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("").toUpperCase();
function hsv2rgb(h,s,v){s/=100;v/=100;const f=n=>{const k=(n+h/60)%6;return 255*(v-v*s*Math.max(0,Math.min(k,4-k,1)))};return[f(5),f(3),f(1)]}
function rgb2hsv(c){const[r,g,b]=c.map(x=>x/255),M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;
  if(d)h=M===r?((g-b)/d+6)%6:M===g?(b-r)/d+2:(r-g)/d+4;return[Math.round(h*60),Math.round(M?d/M*100:0),Math.round(M*100)]}
function oklab(c){const l=c.map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4});
  const L=Math.cbrt(.4122214708*l[0]+.5363325363*l[1]+.0514459929*l[2]),
        M=Math.cbrt(.2119034982*l[0]+.6806995451*l[1]+.1073969566*l[2]),
        S=Math.cbrt(.0883024619*l[0]+.2817188376*l[1]+.6299787005*l[2]);
  return[.2104542553*L+.793617785*M-.0040720468*S,1.9779984951*L-2.428592205*M+.4505937099*S,.0259040371*L+.7827717662*M-.808675766*S]}
/* 100 = cor idêntica; a distância é perceptual, então errar num tom que o olho nota custa mais */
function points(a,b){const p=oklab(a),q=oklab(b),d=Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
  return Math.round(1000*Math.exp(-((d/.18)**1.3)))/10}
const hsbText=c=>{const[h,s,b]=rgb2hsv(c);return`H${h} S${s} B${b}`};
const onColor=c=>{const[r,g,b]=c.map(x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4});
  return .2126*r+.7152*g+.0722*b>.27?"#000":"#fff"};

/* ---- Sorteio das rodadas: mesma semente, mesmas marcas para todos ---- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickBrands(seed,cat,n){const r=rng(seed),list=BRANDS.filter(b=>cat==="tudo"||b[3]===cat);
  for(let i=list.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list.slice(0,n)}

function apply(e,msg){
  const when=settled?Date.now():Math.min(Date.now(),msg.time*1000);
  switch(e.t){
    case"join":{const name=String(e.name||"").slice(0,14)||"Jogador",id=String(e.id||"");if(!id)break;
      const p=S.players.find(x=>x.id===id);if(p)p.name=name;else S.players.push({id,name});break}
    case"start":{if(!(e.g>S.game))break;S.game=e.g;S.n=+e.n;S.secs=+e.secs;S.list=pickBrands(e.seed,e.cat,S.n);S.n=S.list.length;
      S.list.forEach(b=>{new Image().src=logoUrl(b[0],b[1])});S.round=0;S.res=[];S.totals={};S.wins={};S.guesses={};S.phase="round";S.roundAt=when;S.allAt=0;break}
    case"guess":{if(e.g!==S.game||e.r!==S.round||S.phase!=="round"||S.guesses[e.id])break;
      const h=+e.h,s=+e.s,v=+e.v;if([h,s,v].some(x=>!Number.isFinite(x)))break;S.guesses[e.id]=[h,s,v];break}
    case"reveal":{if(e.g!==S.game||e.r!==S.round||S.phase!=="round")break;
      const t=hex2rgb(target()[2]);
      const rows=Object.entries(S.guesses).map(([id,g])=>{const c=hsv2rgb(...g);return{id,hsv:g,hex:rgb2hex(c),pts:points(c,t)}}).sort((a,b)=>b.pts-a.pts);
      rows.forEach(r=>S.totals[r.id]=Math.round(((S.totals[r.id]||0)+r.pts)*10)/10);
      if(rows[0])S.wins[rows[0].id]=(S.wins[rows[0].id]||0)+1;
      S.res[S.round]=rows;S.phase="reveal";S.revealAt=when;break}
    case"next":{if(e.g!==S.game||e.r!==S.round||S.phase!=="reveal")break;
      if(S.round+1>=S.n){S.phase="end";break}
      S.round++;S.guesses={};S.phase="round";S.roundAt=when;S.allAt=0;break}
    case"lobby":{if(e.g===S.game&&S.phase==="end")S.phase="lobby";break}
  }
}

/* ---- Rede: eventos passam pelo servidor; o histórico fica guardado para quem entra depois ---- */
const base=()=>"cordecabeca/v2/"+room;
function netMsg(t){const n=$("#net");n.hidden=!t;if(t)n.textContent=t}
function once(key,fn){if(sent.has(key))return;sent.add(key);fn()}
async function emit(ev,tries=4){
  const m={...ev,mid:uid()+uid(),ts:Date.now()};
  for(let i=0;i<tries;i++){
    if(client&&client.connected){client.publish(base()+"/ev",JSON.stringify(m),{qos:1});return true}
    netMsg("Sem conexão. Tentando de novo…");
    await new Promise(r=>setTimeout(r,800+i*900));
  }
  netMsg("Não consegui enviar. Veja sua internet.");return false;
}
function saveLog(){
  if(!settled||pos()>1)return;
  clearTimeout(logTimer);
  logTimer=setTimeout(()=>{if(client&&client.connected)client.publish(base()+"/log",JSON.stringify(log),{qos:1,retain:true})},600);
}
function ingest(e){
  if(!e||typeof e!=="object"||!e.mid||seen.has(e.mid))return;
  seen.add(e.mid);
  if(e.t==="start")log=log.filter(x=>x.t==="join");
  log.push(e);
  apply(e,{time:(Number(e.ts)||Date.now())/1000});
}
function connect(){
  client=mqtt.connect(BROKER,{clean:true,connectTimeout:8000,reconnectPeriod:2000,clientId:"cdc_"+uid()+uid()});
  client.on("connect",()=>{
    netMsg(null);
    client.subscribe([base()+"/ev",base()+"/log"],{qos:1},()=>{
      if(subscribed)return;subscribed=true;
      setTimeout(()=>{settled=true;
        if(!S.players.some(p=>p.id===me))emit({t:"join",id:me,name:myName});
        render()},1500);
    });
  });
  const lost=()=>netMsg("Reconectando à sala…");
  client.on("reconnect",lost);client.on("offline",lost);client.on("error",()=>{});
  client.on("message",(t,buf)=>{
    let d;try{d=JSON.parse(buf.toString())}catch(x){return}
    (Array.isArray(d)?d:[d]).forEach(ingest);
    if(settled){render();saveLog()}
  });
}

function drawFill(){
  const fx=$("#rFill").getContext("2d"),W=400,H=400;fx.clearRect(0,0,W,H);
  fx.fillStyle=F.base||"rgba(20,20,28,.26)";fx.fillRect(0,0,W,H);
  if(!F.top)return;
  const y=H+34-F.level*(H+68),a=Math.min(16,6+(1-F.level)*18);
  fx.fillStyle=F.top;fx.beginPath();fx.moveTo(0,H);

}
function fillStep(now){
  const dt=Math.min(40,now-F.last);F.last=now;F.t+=dt;F.level+=dt/430;
  if(F.level>=1){F.base=F.top;F.top=null;F.level=0;F.run=false;drawFill();return}
  drawFill();requestAnimationFrame(fillStep);
}
function pour(hex){
  if(hex===F.top||(!F.top&&hex===F.base))return;
  if(calm.matches){F.base=hex;F.top=null;F.level=0;drawFill();return}
  F.top=hex;if(!F.run){F.run=true;F.level=0;F.last=performance.now();requestAnimationFrame(fillStep)}
}
function fillReset(){F.base=null;F.top=null;F.level=0;touched=false;drawFill()}
function lockState(){
  const key=S.game+":"+S.round,done=!!S.guesses[me]||lockedKey===key,b=$("#bLock");
  b.disabled=done||!touched;
  b.textContent=done?"Cravada. Esperando os outros…":touched?"Cravar essa cor":"Mexa nas barras para pintar";
  return done;
}
function paint(){
  const c=hsv2rgb(cur.h,cur.s,cur.v),hex=rgb2hex(c),root=$("#round");
  root.style.setProperty("--c",touched?hex:NEUTRAL);root.style.setProperty("--paint",touched?hex:"#c9c9cf");
  const ci=$("#rCrestImg"),tt=target();if(ci&&tt&&TEAM_SVG[tt[0]]){const want=crestUrl(tt[0],touched?hex:"#c9c9cf");if(ci.getAttribute("src")!==want)ci.setAttribute("src",want)}root.style.setProperty("--on",touched?onColor(c):"#fff");
  if(touched)pour(hex);
  $("#sH").style.setProperty("--track","linear-gradient(90deg,#f00,#ff0 16.6%,#0f0 33.3%,#0ff 50%,#00f 66.6%,#f0f 83.3%,#f00)");
  $("#sS").style.setProperty("--track",`linear-gradient(90deg,${rgb2hex(hsv2rgb(cur.h,0,cur.v))},${rgb2hex(hsv2rgb(cur.h,100,cur.v))})`);
  $("#sV").style.setProperty("--track",`linear-gradient(90deg,#000,${rgb2hex(hsv2rgb(cur.h,cur.s,100))})`);
  $("#rHsb").textContent=`H${cur.h} S${cur.s} B${cur.v}`;
}
function renderRound(){
  show("round");
  const key=S.game+":"+S.round,t=target();
  if(pickKey!==key){pickKey=key;
    cur.h=Math.floor(Math.random()*361);cur.s=25+Math.floor(Math.random()*50);cur.v=30+Math.floor(Math.random()*50);
    $("#sH").value=cur.h;$("#sS").value=cur.s;$("#sV").value=cur.v;fillReset();}
  $("#rNum").textContent=`Rodada ${S.round+1} de ${S.n}`;
  $("#rBrand").textContent=t[0];
  const team=TEAM_SVG[t[0]];$("#rMark").hidden=!!team;$("#rCrest").hidden=!team;
  if(team){if($("#rCrest").dataset.k!==key){$("#rCrest").innerHTML='<img id="rCrestImg" alt="">';$("#rCrest").dataset.k=key}}else $("#rMark").style.setProperty("--logo",`url("${logoUrl(t[0],t[1])}")`);$("#rName").textContent=t[1];
  const done=lockState();
  ["#sH","#sS","#sV"].forEach(s=>$(s).disabled=done);
  $("#rWho").innerHTML=S.players.map(p=>`<span class="${S.guesses[p.id]?"ok":""}">${esc(p.name)}</span>`).join("");
  paint();tick();
}
function lock(){
  if(S.phase!=="round")return;const key=S.game+":"+S.round;if(lockedKey===key||S.guesses[me])return;
  lockedKey=key;emit({t:"guess",g:S.game,r:S.round,id:me,h:cur.h,s:cur.s,v:cur.v});renderRound();
}

function renderReveal(){
  show("reveal");
  const key=S.game+":"+S.round;
  if(shownKey!==key){shownKey=key;
    const t=target(),rows=S.res[S.round]||[],rgb=hex2rgb(t[2]),on=onColor(rgb);
    const orig=`<div class="band orig" style="background:${t[2]};color:${on}"><div class="tile sm" style="--on:${on};--c:${t[2]};--paint:${t[2]}">${art(t,t[2])}</div><small>Original</small><b>${esc(t[0])}</b><small>${t[2]} · ${hsbText(rgb)}</small></div>`;
    const bands=rows.map((r,i)=>{const fg=onColor(hsv2rgb(...r.hsv));
      const tag=i===0&&rows.length>1?`<span class="tag" style="--tagbg:${fg};--tagfg:${r.hex}">${r.pts>=97?"Na mosca":"Mais perto"}</span>`:(i===0&&r.pts>=97?`<span class="tag" style="--tagbg:${fg};--tagfg:${r.hex}">Na mosca</span>`:"");
      return`<div class="band" style="background:${r.hex};color:${fg};animation-delay:${(i+1)*.09}s"><div class="tile sm" style="--on:${fg};--c:${r.hex};--paint:${r.hex}">${art(t,r.hex)}</div>${tag}<b>${esc(nameOf(r.id))}</b><span class="p">${r.pts.toFixed(1)}</span><small>${r.hex} · total ${S.totals[r.id].toFixed(1)}</small></div>`}).join("");
    const none=rows.length?"":`<div class="band" style="background:#222;color:#fff"><b>Ninguém cravou</b></div>`;
    $("#vBands").innerHTML=orig+bands+none;
  }
  $("#bNext").hidden=!isHost();
  $("#bNext").textContent=S.round+1>=S.n?"Ver resultado":"Próxima";
  tick();
}

function renderFinal(){
  show("final");
  const ranked=S.players.map(p=>({id:p.id,name:p.name,t:S.totals[p.id]||0,w:S.wins[p.id]||0})).filter(p=>p.t>0||S.res.some(r=>r&&r.some(x=>x.id===p.id))).sort((a,b)=>b.t-a.t);
  const w=ranked[0],hero=$("#final .hero");
  let best=null;if(w)S.res.forEach(r=>{const x=r&&r.find(y=>y.id===w.id);if(x&&(!best||x.pts>best.pts))best=x});
  const c=best?best.hex:"#15151A";hero.style.setProperty("--c",c);hero.style.setProperty("--on",onColor(hex2rgb(c)));
  $("#fWinner").textContent=w?w.name:"Ninguém";
  $("#fRank").innerHTML=ranked.map((p,i)=>{
    const chips=S.res.map(r=>{const x=r&&r.find(y=>y.id===p.id);return`<i style="background:${x?x.hex:"transparent"}"></i>`}).join("");
    return`<li><span class="pos">${i+1}º</span><b>${esc(p.name)}</b><span class="n">${p.t.toFixed(1)}</span><div class="chips" title="Cor em cada rodada">${chips}</div><span class="or" style="grid-column:2/4">${p.w} ${p.w===1?"rodada vencida":"rodadas vencidas"}</span></li>`}).join("");
  $("#bAgain").hidden=!isHost();
  const fw=$("#fWait");fw.hidden=isHost();
  if(!isHost())fw.textContent=(S.players[0]?S.players[0].name:"O dono da sala")+" pode abrir uma nova partida.";
}

/* ---- Relógio: quem está na sala cobre quem caiu; eventos repetidos são ignorados ---- */
function tick(){
  if(!room||!settled)return;
  const now=Date.now(),k=S.game+":"+S.round,p=pos();
  if(S.phase==="round"){
    const end=S.roundAt+S.secs*1000,left=Math.max(0,end-now);
    $("#rBar").style.transform=`scaleX(${left/(S.secs*1000)})`;
    $("#rSecs").textContent=Math.ceil(left/1000);
    if(left<=0&&!S.guesses[me]&&lockedKey!==k)lock();
    const all=S.players.length>0&&S.players.every(x=>S.guesses[x.id]);
    if(all&&!S.allAt)S.allAt=now;
    if((all&&now>=S.allAt+Math.min(p,8)*1500)||now>=end+2000+Math.min(p,8)*2500)once("r"+k,()=>emit({t:"reveal",g:S.game,r:S.round}));
  }else if(S.phase==="reveal"){
    const wait=9000,left=Math.max(0,S.revealAt+wait-now),last=S.round+1>=S.n;
    $("#vInfo").textContent=(last?"Resultado em ":"Próxima em ")+Math.ceil(left/1000)+"s";
    if(now>=S.revealAt+wait+Math.min(p,8)*2000)once("n"+k,()=>emit({t:"next",g:S.game,r:S.round}));
  }
}
setInterval(tick,200);

/* ---- Entrada ---- */
function enter(code){
  room=code;store.set("cdc-name",myName);
  me=store.get("cdc-id-"+room,true);if(!me){me=uid();store.set("cdc-id-"+room,me,true)}
  const u=new URL(location.href);u.searchParams.set("sala",room);history.replaceState(null,"",u);
  connect();render();
}
function newCode(){const a="BCDFGHJKLMNPQRSTVWXZ";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
const cleanCode=v=>String(v||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
let joining=false;
function setJoin(on,locked){joining=on;$("#codeF").hidden=!on;$("#bPrimary").textContent=on?"Entrar na sala":"Criar sala";
  $("#bToggle").textContent=on?"Criar uma sala nova":"Tenho um código de sala";$("#bToggle").hidden=!!locked;$("#iCode").required=on}

$("#bToggle").onclick=()=>setJoin(!joining);
$("#fHome").onsubmit=e=>{e.preventDefault();
  myName=$("#iName").value.trim().slice(0,14);if(!myName)return;
  if(joining){const c=cleanCode($("#iCode").value);if(c.length!==4){$("#iCode").focus();return}enter(c)}else enter(newCode())};
$("#bCopy").onclick=async()=>{const url=location.origin+location.pathname+"?sala="+room,b=$("#bCopy"),l=$("#lLink");
  try{await navigator.clipboard.writeText(url);b.textContent="Link copiado";setTimeout(()=>b.textContent="Copiar link da sala",1800)}
  catch(e){l.hidden=false;l.value=url;l.select()}};
document.querySelectorAll(".seg").forEach(el=>el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const k=el.dataset.k,v=b.dataset.v;opts[k]=k==="cat"?v:+v;segs()}));
$("#bStart").onclick=()=>{const b=$("#bStart");b.disabled=true;setTimeout(()=>b.disabled=false,1500);
  emit({t:"start",g:S.game+1,seed:Math.floor(Math.random()*2147483647),cat:opts.cat,n:opts.n,secs:opts.secs})};
$("#bLock").onclick=lock;
$("#bNext").onclick=()=>{$("#bNext").hidden=true;once("n"+S.game+":"+S.round,()=>emit({t:"next",g:S.game,r:S.round}))};
$("#bAgain").onclick=()=>emit({t:"lobby",g:S.game});
[["#sH","h"],["#sS","s"],["#sV","v"]].forEach(([s,k])=>$(s).addEventListener("input",e=>{cur[k]=+e.target.value;touched=true;paint();lockState()}));
addEventListener("visibilitychange",()=>{if(!document.hidden&&room)render()});

/* ---- Início ---- */
(function(){
  const bars=[...BRANDS].sort((a,b)=>rgb2hsv(hex2rgb(a[2]))[0]-rgb2hsv(hex2rgb(b[2]))[0]);
  $("#bars").innerHTML=bars.map(b=>`<i style="background:${b[2]}"></i>`).join("");
  $("#iName").value=store.get("cdc-name")||"";
  const c=cleanCode(new URLSearchParams(location.search).get("sala"));
  if(c.length===4){$("#iCode").value=c;setJoin(true,true);$("#bPrimary").textContent="Entrar na sala "+c;$("#codeF").hidden=true}
  show("home");
})();
</script>
</body>
